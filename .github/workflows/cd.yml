name: Continuous Deployment (CD)

on:
  push:
    branches: [ "main" ] # O la rama que usen para producción

jobs:
  # Supongamos que ya se tienen los trabajos de CI llamados 'test-python' y 'test-js'
  # Se puede forzar a que este trabajo dependa de ellos usando 'needs'
  build:
    runs-on: self-hosted
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

  deploy:
    name: Despliegue en Servidor Local Apache
    runs-on: self-hosted # Indica que use el runner local
    # runs-on: [self-hosted, wsl-apache] # Opcional: filtrar por etiqueta
    
    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Desplegar Frontend (JavaScript/HTML)
        run: |
          echo "Desplegando archivos estáticos de JS/HTML en Apache..."
          # Reemplaza 'dist/' o 'public/' por la carpeta donde esté tu frontend buildeado
          # Si es una app JS vainilla, puedes copiar los archivos directamente
          mkdir -p /var/www/html/api/javascript_project
          cp -r ./javascript_project/src* /var/www/html/api/javascript_project/

      - name: Desplegar Backend (Python)
        run: |
          echo "Configurando entorno de Python en el servidor..."
          # Aquí simulas el despliegue del backend en una ruta interna
          mkdir -p /var/www/html/api/python_project
          cp -r ./python_project/* /var/www/html/api/python_project/
          
          # Verifica si existe requirements.txt antes de intentar instalar dependencias
          cd /var/www/html/api/python_project
          if [ -f "requirements.txt" ]; then
            pip3 install -r requirements.txt --user
          else
            echo "No hay archivo requirements.txt. Continuando despliegue..."
          fi

      - name: Reiniciar Apache (Opcional)
        run: |
          echo "Verificando estado del servidor Apache..."
          # Apache en WSL no siempre requiere reinicio para archivos estáticos, 
          # pero si se configuran scripts CGI o WSGI para Python, puede requerirse:
          # sudo service apache2 restart (requerirá configurar sudoers sin contraseña para este comando)

     